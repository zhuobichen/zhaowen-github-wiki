name: Weekly wiki refresh

# 每周一 09:00 Asia/Shanghai（UTC+8）刷新 wiki/
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-wiki
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wiki (public repos only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_wiki.py --public-only --out wiki

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki/
          if git diff --cached --quiet; then
            echo "没有实质变化，跳过提交"
            exit 0
          fi
          git commit -m "docs(wiki): 每周刷新"
          git push
